<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://cdn-icons-png.flaticon.com/512/12222/12222560.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hack.er Agency | Automação e Soluções SaaS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              heading: ['Montserrat', 'sans-serif'],
            },
            colors: {
              brand: {
                purple: '#94a3b8', // Mudado para Slate (Prata)
                cyan: '#22d3ee',   // Mantido Cyan Elétrico
                dark: '#000000',   // Preto absoluto
                card: '#0a0a0a',
                silver: '#e2e8f0',
              }
            },
            backgroundImage: {
              'hero-gradient': 'radial-gradient(circle at center, #1a1a1a 0%, #000000 100%)',
              'text-gradient': 'linear-gradient(to right, #ffffff, #94a3b8, #22d3ee)', // Branco -> Prata -> Ciano
              'glass': 'linear-gradient(145deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.01) 100%)',
              'chrome': 'linear-gradient(to bottom, #ffffff, #cbd5e1)',
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'float-delayed': 'float 6s ease-in-out 3s infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #000000;
        color: #e2e8f0;
        scroll-behavior: smooth;
        overflow-x: hidden;
      }
      
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: #000;
      }
      ::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 5px;
        border: 1px solid #111;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #fff;
      }

      .glow-text {
        text-shadow: 0 0 20px rgba(255, 255, 255, 0.5), 0 0 10px rgba(34, 211, 238, 0.3);
      }
      
      .perspective-container {
        perspective: 1000px;
      }
      
      .card-3d {
        transform-style: preserve-3d;
        transition: transform 0.5s ease;
      }
      
      .card-3d:hover {
        transform: rotateY(10deg) rotateX(5deg) scale(1.02);
      }

      .neon-box {
        box-shadow: 0 0 15px rgba(255, 255, 255, 0.1), inset 0 0 20px rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.35.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
